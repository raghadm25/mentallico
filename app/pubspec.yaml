name: mentallico_app
description: "Mentallico — Mental health app with VR therapy sessions."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  http: ^1.2.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  flutter_embed_unity: ^1.4.3
  flutter_embed_unity_6000_0_android: ^1.0.0
  record: ^6.0.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  firebase_storage: ^12.0.0
  audioplayers: ^6.0.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  google_sign_in: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/doctors/
    - assets/images/user/
    - assets/icons/
    - assets/screens/
    - assets/images/ReminderGraphicContainer.png
    - assets/images/MoodIconsContainer.png
    