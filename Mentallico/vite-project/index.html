    <title>Mentallico</title>

    <!-- Google Identity Services — used by the Sign Up / Log In Google buttons -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Facebook SDK — used by the Sign Up / Log In Facebook buttons.
         Loaded the same way as Google above: a static script tag, with its
         own init callback, instead of being injected on demand. Vite
         substitutes %VITE_FACEBOOK_APP_ID% from .env at build/dev time —
         if it's blank, FB.init() runs with an empty appId and every FB.login()
         call fails immediately, which useSocialAuth.js already handles. -->
    <script>
      window.fbAsyncInit = function () {
        window.FB.init({
          appId: '%VITE_FACEBOOK_APP_ID%',
          cookie: true,
          xfbml: false,
          version: 'v19.0',
        });
      };
    </script>
    <script src="https://connect.facebook.net/en_US/sdk.js" async defer></script>
